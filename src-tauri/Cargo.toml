[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.6.0"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2.5.0"
arboard = "3.4"
image = "0.24"
base64 = "0.22"
# Direct Ollama calls from the app process. The installed WebView cannot fetch
# localhost or a Tailscale host (CORS, mixed content, and the app CSP).
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Native Save dialogs. default-features off matches the copy already pulled in by tauri-plugin-dialog
# (Windows file dialogs do not need the Linux portal / GTK features).
rfd = { version = "0.16", default-features = false }

# Windows-only: reads ChemDraw's custom clipboard formats (see `read_chemdraw_clipboard`).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
